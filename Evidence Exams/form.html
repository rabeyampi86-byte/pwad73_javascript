<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <div id="show"></div>
    <form name="myform" action="">
    <label for="">Name:</label><br>
    <input type="text" name="name" placeholder="Enter your name"><br>
    <label for="">Contact:</label><br>
    <input type="number" name="contact" placeholder="Enter your number"><br>
    <label for="">Remarks:</label><br>
    <textarea name="remarks"></textarea><br>
    <label for="">Sex:</label><br>
    <input type="radio" name="sex" value="Male">Male
    <input type="radio" name="sex" value="Female">Female <br>
    <label for="">Courses:</label><br>
    <input type="checkbox" class="courses" value="NT">NT
    <input type="checkbox" class="courses" value="IAD">IAD
    <input type="checkbox" class="courses" value="DDD">DDD
    <input type="checkbox" class="courses" value="ESAD">ESAD <br>
    <label for="">Location:</label><br>
    <select name="location">
        <option value="">Select Location</option>
        <option>Banani</option>
        <option>Dhanmondi</option>
        <option>Mirpur</option>
    </select> <br> <br>
    <button type="button" onclick="mywindow()">Submit</button>
    </form>
    <script>
        function mywindow(){
            let name = document.myform.name.value;
            let contact = document.myform.contact.value;
            let remarks = document.myform.remarks.value;
            let sex = document.myform.sex.value;
            let location = document.myform.location.value;
            let courseOutput = "";
            const courses = document.getElementsByClassName("courses");
            for(let i = 0; i<courses.length; i++){
                if(courses[i].checked){
                    courseOutput += courses[i].value + ", ";
                }
            }
            let output = "";
            output += "Name: " + name + "<br>";
            output += "Contact: " + contact + "<br>";
            output += "Remarks: " + remarks + "<br>";
            output += "Sex: " + sex + "<br>";
            output += "Location: " + location + "<br>";
            output += " Courses: " + courseOutput + "<br>";
            mywindow = window.open("", "", "height:300px, width:400px");
            mywindow.document.write(output);
       }
       // document.getElementById("show").innerHTML = name;
    </script>
