<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = prompt("Enter the value of a");
        let b = prompt("Enter the value of b");
        let c = prompt("Enter the value of c");
        a = parseInt(a);
        b = parseInt(b);
        c = parseInt(c);
        let max = a;
        let min = a;
        if(b>max){
            max = b;
        } else if (c>max){
            max = c;
        } else if (b<min){
            min = b;
        } else if (c<min){
            min = c;
        }
        document.write("The maximum number is " + max + "<br>");
        document.write("The minimum number is " + min);
    </script>
</body>
</html>
