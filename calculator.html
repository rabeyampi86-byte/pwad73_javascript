<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function addnumbers(a, b){
            return a + b;
        }
        function substractnumbers(a, b){
            return a - b;
        }
        function multiplaynumbers(a, b){
            return a * b;
        }
        function divisionnumbers(a, b){
            return a / b;
        }
    </script>
</head>
<body>
    <script>
        // Function call
        let sum = addnumbers(5, 3);
        alert("Sum: " + sum);
        let difference = substractnumbers(10, 4);
        alert("Difference: " + difference);
        let product = multiplaynumbers(6, 7);
        alert("Product: " + product);
        let separate = divisionnumbers(21, 7);
        alert("Separate: " + separate);
    </script>
</body>
</html>
