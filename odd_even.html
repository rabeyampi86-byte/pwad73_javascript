<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function oddOrEven(){
            let number = prompt("Plesase enter a number");
            number = parseInt(number);
            if (number % 2 === 0){
                alert("Your provided number " + number + " is Even.");
            } else {
                alert("Your provided number " + number + " is Odd");
            }
        }
    </script>
</head>
<body>
    <button onclick="oddOrEven()">Check your number</button>
</body>
</html>
