<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let n = window.prompt("Ente a number");
        n = parseInt(n);
        function prime(n){
            if (n===1){
                return n + "Not a prime number";
            }
            else if(n===2){
                return n + " is a prime number";
            }else{
               for (var x = 2; x < n; x++){
                if (x % n === 0){
                    return n + "Not a prime number";
                }
                }
                return n + " is a prime number"
            }
        }
        document.write(prime(n));
    </script>
</body>
</html>
