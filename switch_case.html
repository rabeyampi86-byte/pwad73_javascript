<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let mpi = prompt("enter your number");
        switch(mpi){
            case "1":
            document.write("True");
            break;
            case "2":
            document.write("Yes");
            break;
            case "3":
            document.write("False");
            break;
            case "4":
            document.write("No");
            break;
            default:
                document.write("Not Given");
        }
    </script>
</body>
</html>
